name: Main Pipeline

on:
  push:
    branches: [main]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (customer)
        run: npm ci
        working-directory: customer
      - name: npm audit (customer)
        run: npm audit --audit-level=high
        working-directory: customer
        continue-on-error: true

      - name: Install dependencies (merchant)
        run: npm ci
        working-directory: merchant
      - name: npm audit (merchant)
        run: npm audit --audit-level=high
        working-directory: merchant
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        continue-on-error: true

  deploy-customer:
    needs: [dependency-audit, secret-scan, code-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel
      - run: vercel deploy --prod --yes --cwd customer --token=${{ secrets.VERCEL_TOKEN }}

  deploy-merchant:
    needs: [dependency-audit, secret-scan, code-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g vercel
      - run: vercel deploy --prod --yes --cwd merchant --token=${{ secrets.VERCEL_TOKEN }}